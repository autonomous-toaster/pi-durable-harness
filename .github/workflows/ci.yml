name: check

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the framework's floor, 24 is current: the storage facade and the TUI both ride on
        # Node's behaviour, so both ends of the supported range run the same gate.
        node: ["22.19.0", "24"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      # The gate is only a gate when the PostgreSQL suites run: a skip here is a failure (task 1.2).
      CI: "true"
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PI_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
